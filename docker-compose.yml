services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crypto_fraud_intelligence
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5433:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crypto_fraud_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/rrr_dev_password
    ports: ["7474:7474", "7687:7687"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/crypto_fraud_intelligence
      DEMO_MODE: ${DEMO_MODE:-true}
      RRR_DEMO_USER: ${RRR_DEMO_USER:-RRR@SIH}
      RRR_DEMO_PASSWORD: ${RRR_DEMO_PASSWORD:-SIH@2026}
      TRONGRID_API_KEY: ${TRONGRID_API_KEY:-}
      TRONGRID_BASE_URL: ${TRONGRID_BASE_URL:-https://api.trongrid.io}
      CHAINABUSE_API_KEY: ${CHAINABUSE_API_KEY:-}
      CHAINABUSE_BASE_URL: ${CHAINABUSE_BASE_URL:-https://api.chainabuse.com/v0}
      CHAINABUSE_SOURCE_VERSION: ${CHAINABUSE_SOURCE_VERSION:-chainabuse-public-v1.2}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: rrr_dev_password
      BLOCKCHAIN_DATA_MODE: DEVELOPMENT_FIXTURE
      API_ORIGIN: http://localhost:8000
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/system/status')\""]
      interval: 10s
      timeout: 5s
      retries: 12
  web:
    build:
      context: ./apps/investigator-web
    environment:
      VITE_API_BASE_URL: ""
      VITE_API_TARGET: "http://api:8000"
    ports: ["5173:5173"]
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
